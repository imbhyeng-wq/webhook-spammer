<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP LOGGER</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', monospace;
    background: #000;
    overflow: hidden;
    color: #fff;
}

/* Animated neon background */
.bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(45deg, #ff0000, #ffffff, #ff0000, #ffffff);
    background-size: 400% 400%;
    animation: neonFlow 12s ease infinite;
    z-index: -1;
}

@keyframes neonFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating neon particles */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,0,0,0.9);
    border-radius: 50%;
    box-shadow: 0 0 15px #ff0000, 0 0 30px #fff;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-120vh); opacity: 0; }
}

/* Center panel */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 900px;
    padding: 40px;
    background: rgba(0,0,0,0.7);
    border-radius: 20px;
    border: 3px solid #ff0000;
    box-shadow: 0 0 40px #ff0000, 0 0 60px #fff;
    text-align: center;
}

/* Title */
h1 {
    font-size: 60px;
    margin: 0;
    color: #ff0000;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #fff;
    animation: glowPulse 1.5s infinite alternate;
}

@keyframes glowPulse {
    from { text-shadow: 0 0 20px #ff0000, 0 0 40px #fff; }
    to { text-shadow: 0 0 40px #ff0000, 0 0 80px #fff; }
}

/* Status bar */
.status {
    font-size: 24px;
    margin-top: 20px;
    color: #fff;
    text-shadow: 0 0 15px #ff0000;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%,50%,100% { opacity: 1; }
    25%,75% { opacity: 0.3; }
}

/* Neon alert bar */
.alert-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 0;
    background: linear-gradient(90deg, #ff0000, #fff, #ff0000, #fff);
    background-size: 400% 400%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #fff;
    animation: alertAnim 3s linear infinite;
    z-index: 10;
}

@keyframes alertAnim {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="particles"></div>

<div class="panel">
    <h1>IP LOGGER</h1>
    <div class="status">Collecting Data... 🔥</div>

<script>
    // Particle spawner
    for(let i=0;i<80;i++){
        let p=document.createElement("div");
        p.className="particle";
        p.style.left=Math.random()*100+"vw";
        p.style.top=Math.random()*100+"vh";
        p.style.animationDelay=Math.random()*5+"s";
        p.style.opacity=Math.random()*0.8+0.2;
        document.querySelector(".particles").appendChild(p);
    }
</script>
